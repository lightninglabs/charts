{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lnd.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "lnd.name" . }}
      release: {{ .Release.Name }}
      node: lnd

  policyTypes:
    - Ingress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
{{- end }}
