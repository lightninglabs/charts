# Default values for lnd.
# This is a YAML-formatted file.
global:
  network: mainnet

# rbac configuration.
rbac:
  create: true

serviceAccount:
  create: true

# lnd configuration.
lnd:
  repository: lightninglabs/lndinit
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
  backupPersistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 512Mi
  config:
    bitcoin:
      node: bitcoind
      credentials:
        secretName: bitcoin-rpc
        userKey: "rpcuser"
        passwordKey: "rpcpass"
  db:
    useNativeSql: false
    backend: bolt
  service:
    # types supported in svc.yaml:
    # gateway: expose p2p via LB to the world and the rpc port
    #          internally to the cluster
    # primary: just expose the p2p and rpc ports as a service to the cluster
    # other:   generic lnd node that exposes p2p and rpc port
    #          internally to the cluster
    #
    # NOTE: The variables p2pTargetPort and rpcTargetPort must always be set,
    # independent of the type. the flag will always be set in lnd, but the
    # service won't expose the port depending on the type.
    type: primary
    p2pPort: 9735
    p2pTargetPort: 9735
    rpcPort: 10009
    rpcTargetPort: 10009
  bitcoind:
    # NOTE: This assumes that bitcoind is deployed to the same namespace.
    hostname: bitcoind
    zmqpubrawblock: tcp://bitcoind:28332
    zmqpubrawtx: tcp://bitcoind:28333
  secrets:
    remoteSigning: false

# Configure image pull secrets.
usePullSecrets: false
pullSecrets:
  - name: image-pull-secret 

# lndmon: exposes additional network and payment related metrics.
# optionally deploy as additional container in lnd deployment.
lndmon:
  enabled: false
  prometheus:
    port: 8990
    lndInstance: primary
    serviceMonitor: false
    noLegacyAnnotations: false
  serviceMonitorLabels:
    labels:
      app: '{{ template "lnd.name" . }}'
      chart: '{{ template "lnd.chart" . }}'
      release: '{{ .Release.Name }}'
      heritage: '{{ .Release.Service }}'
      instance: '{{ .Values.lndmon.grafanaInstanceLabel }}'
      lnd_instance: '{{ .Values.lndmon.prometheus.lndInstance }}'
      cluster_name: '{{ .Values.global.clusterName }}'
      app.kubernetes.io/part-of: kube-prometheus
    selectorLabels:
      app: '{{ template "lnd.name" . }}'
      release: '{{ .Release.Name }}'
      lnd_instance: '{{ .Values.lndmon.prometheus.lndInstance }}'
    targetLabels:
      - app
      - lnd_instance
  grafanaInstanceLabel: ""
