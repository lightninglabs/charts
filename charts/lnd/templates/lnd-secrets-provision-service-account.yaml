{{- if .Values.rbac.create }}
{{- $secrets := .Values.lnd.secrets | default dict }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: 
  name: {{ template "lnd.fullname" . }}-update-secrets
  namespace: {{ .Release.Namespace }}
rules: 
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "update", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "lnd.fullname" . }}-update-secrets_lnd-provision
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ template "lnd.fullname". }}-update-secrets
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ template "lnd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- if $secrets.remoteSigning }}
---
# This is the role that gives access to the signer's RPC secrets. This includes
# the tls.cert, the macaroons and the accounts.json.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "lnd.fullname" . }}-read-signer-rpc-secrets
  namespace: {{ $secrets.remoteSigningNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # We only allow access to this one specific secret. We must make sure to
    # give this secret a name that is unique across namespaces to avoid access
    # to unrelated secrets.
    resourceNames: ["{{ $secrets.remoteSigningRPCSecretName }}"]
    verbs: ["get", "watch", "list"]

# We bind the role in the signer namespace to the service account in the node's
# namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "lnd.fullname" . }}-read-signer-rpc-secrets_lnd-provision
  namespace: {{ $secrets.remoteSigningNamespace }}
roleRef:
  kind: Role
  name: {{ template "lnd.fullname". }}-read-signer-rpc-secrets
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ template "lnd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
  
{{- if $secrets.remoteSigningInit }}
{{- if eq $secrets.remoteSigningInit "convert" }}
---
# This is the role that gives the remote signer access to the already existing
# node's seed and wallet password. This is another cross-namespace role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "lnd.fullname" . }}-read-existing-wallet-secrets
  namespace: {{ $secrets.existingWalletSecretNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # We only allow access to this one specific secret. We must make sure to
    # give this secret a name that is unique across namespaces to avoid access
    # to unrelated secrets.
    resourceNames: ["{{ $secrets.existingWalletSecretPrefix }}-lnd-wallet-secret"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "lnd.fullname" . }}-read-existing-wallet-secrets_lnd-provision
  namespace: {{ $secrets.existingWalletSecretNamespace }}
roleRef:
  kind: Role
  name: {{ template "lnd.fullname". }}-read-existing-wallet-secrets
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ template "lnd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}

{{- end }}
